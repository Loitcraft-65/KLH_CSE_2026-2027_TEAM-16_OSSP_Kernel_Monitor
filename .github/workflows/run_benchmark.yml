name: Run AeroSearch Parallel Benchmarks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  benchmark:
    name: C Multi-Thread Concurrency Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up GCC and Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential
          cd "OSSP Hackathon/source code"
          pip install -r backend/requirements.txt

      - name: Compile C Multi-threaded Engine
        run: |
          cd "OSSP Hackathon/source code/c_engine"
          make clean
          make
          ./parallel_search -h

      - name: Generate Benchmark Dataset
        run: |
          cd "OSSP Hackathon/source code"
          python -c "from backend.data_gen import generate_mock_dataset; res = generate_mock_dataset('test_dataset', 800); print(f'Created {res[\"files_created\"]} files')"

      - name: Run Multi-Threaded Scaling Benchmark (1, 2, 4, 8, 16 threads)
        run: |
          cd "OSSP Hackathon/source code"
          python -c "
          import asyncio, json, os
          from backend.benchmark import run_benchmark_suite
          async def main():
              res = await run_benchmark_suite('test_dataset', pattern='HACKATHON', thread_counts=[1, 2, 4, 8, 16])
              print('=== BENCHMARK SCALING RESULTS ===')
              header = '| Threads | Time (ms) | Speedup | Efficiency | Amdahl Speedup | Throughput |'
              sep = '| :---: | :---: | :---: | :---: | :---: | :---: |'
              rows = [header, sep]
              for r in res['results']:
                  row = f\"| **{r['threads']} Threads** | {r['duration_ms']:.2f} ms | **{r['speedup']:.2f}x** | {r['efficiency_percent']:.1f}% | {r['amdahl_speedup']:.2f}x | {r['throughput_files_sec']:.1f} files/s |\"
                  rows.append(row)
              summary_md = '\n'.join(rows)
              print(summary_md)
              summary_file = os.environ.get('GITHUB_STEP_SUMMARY')
              if summary_file:
                  with open(summary_file, 'a') as f:
                      f.write('## 🚀 AeroSearch Parallel Concurrency Benchmark (Team 16)\n\n' + summary_md + '\n')
          asyncio.run(main())
          "

      - name: Standalone C CLI Direct Search Test
        run: |
          cd "OSSP Hackathon/source code"
          ./c_engine/parallel_search -d ./test_dataset -p "HACKATHON_CHAMPION_2026" -t 4
